  .etiqueta.c{background:rgba(255,180,87,.10);color:var(--amber);border:1px solid rgba(255,180,87,.25)}
  .etiqueta.materia{background:rgba(123,147,165,.08);color:var(--muted);border:1px solid var(--line)}
  .enunciado{margin:0 0 8px;font-weight:600;font-size:1rem;color:var(--ink);line-height:1.5}
  .opciones{margin-top:10px}

  .opcion:hover:not(:disabled){background:rgba(56,242,192,.04);border-color:rgba(56,242,192,.35);transform:translateX(2px)}

  .letra{font-weight:700;color:var(--muted);flex:0 0 auto;min-width:16px;font-family:'JetBrains Mono',monospace;font-size:.78rem}

  .opcion.incorrecta .letra{color:var(--red)}

  </header>

  <div class="panel">

<script>
const preguntas = [

/* ========= ANATOMÍA (1-7) ========= */
{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuántos lóbulos tienen el pulmón derecho y el izquierdo, respectivamente?",
  ops:["3 e 2",
       "2 e 3",
       "2 e 2",
       "3 e 3"],
  ok:0,
  exp:"O pulmão direito tem 3 lobos (superior, médio e inferior), com 10 segmentos broncopulmonares. O pulmão esquerdo tem 2 lobos (superior com a língula e inferior), com 8-9 segmentos, pois o coração ocupa espaço no lado esquerdo." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuántos segmentos broncopulmonares tiene el pulmón derecho?",
  ops:["10",
       "8",
       "6",
       "12"],
  ok:0,
  exp:"O pulmão direito tem 10 segmentos broncopulmonares: 3 no lobo superior, 2 no lobo médio e 5 no lobo inferior. O pulmão esquerdo tem 8-9 segmentos." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Qué estructura marca a divisão entre o pulmão direito e o esquerdo?",
  ops:["Mediastino",
       "Carina",
       "Hilo pulmonar",
       "Diafragma"],
  ok:0,
  exp:"O mediastino é o compartimento central que separa os dois pulmões. Contém o coração, grandes vasos, traqueia, esôfago, timo, linfonodos e nervos (frênico, vago, simpático)." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Dónde se localiza a carina?",
  ops:["Na bifurcação da traqueia em brônquios principais direito e esquerdo",
       "Na entrada do esôfago no tórax",
       "Na saída do coração da cavidade torácica",
       "No ápice pulmonar"],
  ok:0,
  exp:"A carina é a crista na bifurcação da traqueia (geralmente na altura de T4-T5), onde se divide nos brônquios principais direito e esquerdo. O brônquio principal direito é mais curto, mais largo e mais vertical, predispondo à aspiração." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Qué é o hilo pulmonar?",
  ops:["Região por onde entram e saem os brônquios, vasos pulmonares e linfáticos",
       "A membrana que reveste os pulmões",
       "O espaço entre os lobos pulmonares",
       "A parte superior do pulmão"],
  ok:0,
  exp:"O hilo pulmonar é a região medial do pulmão por onde passam o brônquio principal, a artéria pulmonar, as veias pulmonares, vasos linfáticos e nervos. É importante na cirurgia torácica por ser sede de dissecção e de linfonodos." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Qué é a pleura?",
  ops:["Membrana serosa que reveste os pulmões (visceral) e a cavidade torácica (parietal)",
       "Músculo da respiração",
       "Cartilagem da traqueia",
       "Parte do mediastino"],
  ok:0,
  exp:"A pleura é uma membrana serosa dupla: visceral (aderida ao pulmão) e parietal (aderida à parede torácica). Entre elas há o espaço pleural (com uma fina camada de líquido lubrificante), onde se acumulam ar (pneumotórax), sangue (hemotórax) ou líquido (derrame pleural)." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuál es la principal função do diafragma na respiração?",
  ops:["Gerar a pressão negativa intratorácica na inspiração",
       "Produzir surfactante",
       "Aquecer o ar inspirado",
       "Filtrar o ar"],
  ok:0,
  exp:"O diafragma é o principal músculo da inspiração. Sua contração aumenta o volume da caixa torácica, criando pressão negativa intratorácica que puxa o ar para os pulmões. Lesão do nervo frênico pode causar paralisia diafragmática." },

/* ========= CIRURGIAS PULMONARES (8-14) ========= */
{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Qué é uma lobectomia?",
  ops:["Remoção de um lobo pulmonar",
       "Remoção de um segmento pulmonar",
       "Remoção de um pulmão inteiro",
       "Biópsia pulmonar"],
  ok:0,
  exp:"A lobectomia é a remoção de um lobo pulmonar, com dissecção individual dos vasos e brônquios lobares e linfadenectomia. É o padrão-ouro para o câncer de pulmão não pequenas células localizado." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Qué é uma pneumonectomia?",
  ops:["Remoção completa de um pulmão",
       "Remoção de um lobo pulmonar",
       "Ressecção de um segmento",
       "Biópsia por videotoracoscopia"],
  ok:0,
  exp:"A pneumonectomia é a remoção completa de um pulmão. Indicada em tumores centrais que envolvem o hilo pulmonar ou quando a lobectomia não é viável. Tem maior morbimortalidade que a lobectomia e exige avaliação criteriosa da função pulmonar." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Qué é uma segmentectomia pulmonar?",
  ops:["Remoção de um segmento broncopulmonar",
       "Remoção de um lobo inteiro",
       "Remoção de um pulmão",
       "Biópsia por agulha"],
  ok:0,
  exp:"A segmentectomia remove apenas um segmento broncopulmonar, preservando o restante do lobo. É indicada em tumores pequenos (<2 cm) periféricos ou em pacientes com reserva pulmonar limitada." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Cuál é a principal vantagem da cirurgia torácica por videotoracoscopia (VATS)?",
  ops:["Menor dor pós-operatória, menor tempo de internação e recuperação mais rápida",
       "Menor custo cirúrgico",
       "Maior exposição do campo operatório",
       "Menor taxa de recidiva tumoral"],
  ok:0,
  exp:"A VATS (cirurgia torácica videoassistida) é realizada por 2-4 pequenas incisões, sem toracotomia. Reduz a dor pós-operatória, o tempo de internação, as complicações respiratórias e permite recuperação mais rápida, com resultados oncológicos equivalentes à toracotomia em centros experientes." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Qual é a indicação de ressecção pulmonar em metástases de outros tumores (metastasectomia)?",
  ops:["Metástases pulmonares isoladas ou limitadas, com controle do tumor primário",
       "Todas as metástases pulmonares, independente do número",
       "Apenas metástases de melanoma",
       "Nunca é indicada"],
  ok:0,
  exp:"A metastasectomia pulmonar é indicada em pacientes com metástases pulmonares limitadas (geralmente <5), controladas do tumor primário, com bom estado geral e função pulmonar adequada. Os tumores mais frequentemente operados são colorretal, renal, sarcoma e cabeça/pescoço." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Qué é a cirurgia de sleeves (ressecção em manga)?",
  ops:["Ressecção de um segmento do brônquio com anastomose brônquica, preservando o parênquima pulmonar",
       "Ressecção de toda a pleura",
       "Ressecção do diafragma",
       "Ressecção do esterno"],
  ok:0,
  exp:"A ressecção em manga (sleeve) é a remoção de um segmento do brônquio (ou da artéria pulmonar) comprometido por tumor, com reconstrução por anastomose. Preserva o parênquima pulmonar, evitando pneumonectomia em tumores centrais." },

{ cat:"Cirugía pulmonar", tipo:"teoria",
  q:"¿Cuál é a principal contraindicação à ressecção pulmonar no câncer de pulmão?",
  ops:["Metástases à distância e função pulmonar inadequada",
       "Idade acima de 60 anos",
       "Tabagismo ativo",
       "Diabetes"],
  ok:0,
  exp:"As principais contraindicações à ressecção pulmonar são: metástases à distância (estádio IV), função pulmonar inadequada (VEF1 ou DLCO <40% previsto, ou <30% em lobectomia), comprometimento nodal extenso (N3), e estado geral debilitado (ECOG >2)." },

/* ========= CÂNCER DE PULMÃO (15-22) ========= */
{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Cuál é o tipo histológico mais comum de câncer de pulmão?",
  ops:["Adenocarcinoma",
       "Carcinoma de pequenas células",
       "Carcinoma de grandes células",
       "Mesotelioma"],
  ok:0,
  exp:"O adenocarcinoma é o tipo histológico mais comum de câncer de pulmão (~40-50%), especialmente em não fumantes, mulheres e jovens. O carcinoma escamoso e o carcinoma de pequenas células também são frequentes." },

{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Qual tipo de câncer de pulmão está mais associado ao tabagismo e tem pior prognóstico?",
  ops:["Carcinoma de pequenas células",
       "Adenocarcinoma",
       "Carcinoma escamoso",
       "Carcinoide típico"],
  ok:0,
  exp:"O carcinoma de pequenas células (SCLC) é o tipo mais fortemente associado ao tabagismo, com crescimento rápido e alta tendência metastática precoce. É geralmente tratado com quimioterapia e radioterapia (raramente cirurgia)." },

{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Qual é a principal diferença entre câncer de pulmão de pequenas células (SCLC) e não pequenas células (NSCLC)?",
  ops:["SCLC é mais agressivo, metastático precocemente e tratado com quimio/radioterapia; NSCLC pode ser tratado com cirurgia em estádios iniciais",
       "SCLC é tratado apenas com cirurgia",
       "NSCLC é sempre metastático",
       "SCLC nunca está associado ao tabagismo"],
  ok:0,
  exp:"SCLC (10-15% dos casos) é altamente agressivo, com metástases precoces e tratamento baseado em quimioterapia + radioterapia (raramente cirurgia). NSCLC (85-90%) tem cirurgia como tratamento padrão nos estádios iniciais (I-II), com quimio/radio adjuvante conforme o estádio." },

{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Qué es el estadiamento TNM do câncer de pulmão?",
  ops:["T (tamanho/invasão do tumor), N (linfonodos), M (metástases)",
       "T (tempo de evolução), N (número de tumores), M (marcadores)",
       "Apenas T (tamanho) e M (metástases)",
       "T (tipo histológico), N (necrose), M (mutações)"],
  ok:0,
  exp:"O TNM estadiamento: T = tamanho e invasão local do tumor primário; N = envolvimento de linfonodos regionais (N0-N3); M = metástases à distância (M0/M1). Define o estádio (I-IV) e a conduta terapêutica." },

{ cat:"Cáncer de pulmão", tipo:"caso",
  q:"Paciente de 62 anos, tabagista, com nódulo pulmonar de 2,5 cm em lobo superior direito, sem metástases. Espirometria e função pulmonar adequadas. Qual é a conduta padrão?",
  ops:["Lobectomia com linfadenectomia mediastinal",
       "Segmentectomia apenas",
       "Pneumonectomia",
       "Apenas quimioterapia"],
  ok:0,
  exp:"O tratamento padrão do NSCLC em estádio I-II é a lobectomia com linfadenectomia mediastinal (pelo menos 6 linfonodos, 3 estações). A segmentectomia é reservada para tumores pequenos (<2 cm) periféricos ou pacientes com função pulmonar limitada." },

{ cat:"Cáncer de pulmão", tipo:"caso",
  q:"Paciente de 55 anos, com carcinoma de pulmão de pequenas células (SCLC) localizado (estádio limitado). Qual é a conduta?",
  ops:["Quimioterapia + radioterapia torácica (raramente cirurgia)",
       "Cirurgia isolada",
       "Apenas observação",
       "Transplante pulmonar"],
  ok:0,
  exp:"SCLC em estádio limitado (confined ao tórax): quimioterapia à base de platina + radioterapia torácica precoce. A cirurgia é reservada a casos muito selecionados (T1-T2 N0 M0, <5% dos casos). Em estádio extenso, apenas quimioterapia + imunoterapia paliativa." },

{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Cuál é o principal fator de risco evitável para o câncer de pulmão?",
  ops:["Tabagismo",
       "Poluição do ar",
       "Radônio",
       "Asbesto"],
  ok:0,
  exp:"O tabagismo é o principal fator de risco evitável para o câncer de pulmão (cerca de 85% dos casos). A cessação do tabagismo reduz significativamente o risco ao longo do tempo." },

{ cat:"Cáncer de pulmão", tipo:"teoria",
  q:"¿Cuál é a indicação de cirurgia no câncer de pulmão com metástase cerebral única?",
  ops:["Ressecção do tumor pulmonar + ressecção/radioterapia da metástase (se controlável)",
       "Apenas quimioterapia paliativa",
       "Contraindicação absoluta de cirurgia",
       "Apenas radioterapia paliativa"],
  ok:0,
  exp:"Metástase cerebral única e controlável, associada a tumor pulmonar ressecável, pode ser tratada com cirurgia do pulmão + ressecção ou radiocirurgia da metástase cerebral. Nesses casos selecionados, a sobrevida em 5 anos pode chegar a 20-30%." },

/* ========= DRENAGEM TORÁCICA (23-27) ========= */
{ cat:"Drenagem torácica", tipo:"teoria",
  q:"¿Cuál é a principal indicação de drenagem torácica?",
  ops:["Pneumotórax, hemotórax, derrame pleural, empiema e pós-operatório de cirurgias torácicas",
       "Asma aguda grave",
       "Pneumonia lobar",
       "Bronquite crônica"],

/* ========= LÓGICA ========= */
const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleOptions(p) {
  const idx = p.ops.map((_, i) => i);
  shuffle(idx);
  return { ...p, ops: idx.map(i => p.ops[i]), ok: idx.indexOf(p.ok) };
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  const lote = preguntas.map(shuffleOptions);

  lote.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });

  const letras = {A:0, B:0, C:0, D:0};
  lote.forEach(p => { letras['ABCD'[p.ok]]++; });
  console.log('=== Distribución de ESTA sesión ===');
  console.log('Correctas por letra:', letras);
}

construir();
</script>
