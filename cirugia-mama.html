<style>
  :root{--bg:#070d12;--surface:#0d151d;--surface-hi:#151e26;--line:#1b2833;--line-hi:#2c3d49;--ink:#e6f1f7;--muted:#7b93a5;--mint:#38f2c0;--amber:#ffb457;--red:#f87171;}
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;line-height:1.55;min-height:100vh;padding:0 14px 90px;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(56,242,192,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(56,242,192,.055) 1px,transparent 1px);background-size:58px 58px;-webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%)}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(700px 420px at 18% -8%, rgba(56,242,192,.16), transparent 65%),radial-gradient(650px 450px at 85% 5%, rgba(53,208,255,.12), transparent 65%),radial-gradient(600px 400px at 50% 108%, rgba(181,140,255,.10), transparent 65%)}
  .contenedor{max-width:880px;margin:0 auto;position:relative;z-index:1}
  .topbar{display:flex;align-items:center;padding:22px 0 0;font-size:.82rem;color:var(--muted)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);letter-spacing:-.01em;font-size:.95rem;white-space:nowrap;text-decoration:none}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(56,242,192,.7);animation:pulse 1.8s infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,242,192,.7)}70%{box-shadow:0 0 0 12px rgba(56,242,192,0)}100%{box-shadow:0 0 0 0 rgba(56,242,192,0)}}
  .flags{display:inline-flex;align-items:center;gap:6px;margin-left:6px;user-select:none}
  .flags svg{width:22px;height:auto;display:block;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .25s ease}
  .flags svg:hover{transform:scale(1.12)}
  .volver{position:fixed;bottom:20px;left:20px;z-index:100;background:rgba(13,21,29,.92);color:var(--mint);border:1px solid rgba(56,242,192,.45);backdrop-filter:blur(12px);padding:10px 18px;border-radius:30px;text-decoration:none;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(56,242,192,.18),0 4px 14px rgba(0,0,0,.5);transition:background .2s,color .2s,transform .15s;display:inline-flex;align-items:center;gap:8px}
  .volver:hover{background:var(--mint);color:#04222b;border-color:var(--mint);transform:translateY(-2px)}
  .volver .arrow{transition:transform .2s}
  .volver:hover .arrow{transform:translateX(-3px)}
  header.hero{margin-top:40px;padding:28px 26px 26px;border-radius:18px;background:linear-gradient(180deg,rgba(56,242,192,.06),rgba(56,242,192,0));border:1px solid var(--line);position:relative;overflow:hidden}
  header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 200px at 0% 0%, rgba(56,242,192,.15), transparent 70%)}
  .hero-kicker{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mint);border:1px solid rgba(56,242,192,.35);background:rgba(56,242,192,.06);padding:5px 12px;border-radius:999px;display:inline-block;position:relative}
  header.hero h1{margin:14px 0 6px;font-size:1.5rem;letter-spacing:-.03em;font-weight:700;line-height:1.25;color:var(--ink);position:relative}
  header.hero p{margin:0;font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);position:relative}
  .panel{position:sticky;top:12px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(13,21,29,.88);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin:20px 0;font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.04em}
  .panel .marcador{color:var(--mint);font-weight:500}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:14px;transition:border-color .25s,box-shadow .25s;position:relative}
  .card:hover{border-color:var(--line-hi)}
  .card.teoria{border-left:3px solid var(--mint)}
  .card.caso{border-left:3px solid var(--amber)}
  .cabecera{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .numero{background:rgba(56,242,192,.10);color:var(--mint);border:1px solid rgba(56,242,192,.30);font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .etiqueta{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .etiqueta.t{background:rgba(56,242,192,.10);color:var(--mint);border:1px solid rgba(56,242,192,.25)}
  .etiqueta.c{background:rgba(255,180,87,.10);color:var(--amber);border:1px solid rgba(255,180,87,.25)}
  .etiqueta.materia{background:rgba(123,147,165,.08);color:var(--muted);border:1px solid var(--line)}
  .enunciado{margin:0 0 8px;font-weight:600;font-size:1rem;color:var(--ink);line-height:1.5}
  .opciones{margin-top:10px}
  .opcion{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;font-family:'Space Grotesk',inherit;font-size:.92rem;color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,transform .12s}
  .opcion:hover:not(:disabled){background:rgba(56,242,192,.04);border-color:rgba(56,242,192,.35);transform:translateX(2px)}
  .opcion:disabled{cursor:default;opacity:.55}
  .letra{font-weight:700;color:var(--muted);flex:0 0 auto;min-width:16px;font-family:'JetBrains Mono',monospace;font-size:.78rem}
  .opcion.correcta{background:rgba(56,242,192,.10);border-color:var(--mint);opacity:1;font-weight:600}
  .opcion.correcta .letra{color:var(--mint)}
  .opcion.incorrecta{background:rgba(248,113,113,.08);border-color:var(--red);opacity:1}
  .opcion.incorrecta .letra{color:var(--red)}
  .explicacion{display:none;margin-top:14px;padding:14px 16px;border-radius:10px;background:rgba(56,242,192,.05);border-left:3px solid var(--mint);font-size:.88rem;color:var(--ink);line-height:1.65}
  .explicacion strong{color:var(--mint)}
  .explicacion.visible{display:block;animation:aparecer .28s ease}
  @keyframes aparecer{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:34px}
  @media(max-width:560px){header.hero{padding:22px 18px 20px;border-radius:14px}header.hero h1{font-size:1.18rem}.card{padding:18px 16px 14px}.opcion{font-size:.88rem}.panel{font-size:.7rem;padding:10px 14px}.brand{font-size:.86rem}.flags svg{width:20px}.volver{bottom:14px;left:14px;padding:9px 15px;font-size:.82rem}}
</style>

  <div class="panel">
    <span class="marcador" id="marcador">Respondidas: 0 / 0 · Aciertos: 0</span>

<script>
const preguntas = [

/* ANATOMÍA (1-5) */
{ cat:"Anatomía", tipo:"teoria",
  q:"¿Hacia dónde drena principalmente la linfa de la mama?",
  ops:["Ganglios inguinales del muslo",
       "Ganglios axilares",
       "Cervicales profundos del cuello",
       "Mediastínicos posteriores"],
  ok:1,
  exp:"Aproximadamente 75% da linfa drena para os linfonodos axilares (níveis I, II, III de Berg). O restante vai para a cadeia mamária interna e, em menor proporção, para supraclaviculares." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cómo se dividen quirúrgicamente los niveles de Berg de la axila?",
  ops:["Lateral, posterior y medial",
       "Superior, medio, inferior",
       "Superficial, medio, profundo",
       "Cuello, axila, tórax, brazo"],
  ok:0,
  exp:"Nível I: lateral ao peitoral menor. Nível II: entre as bordas do peitoral menor. Nível III: medial ao peitoral menor, até a borda inferior da clavícula." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Qué nervios deben preservarse en la disección axilar?",
  ops:["Vago, frénico y laríngeo recurrente",
       "Torácico longo y toracodorsal",
       "Radial, mediano y cubital",
       "Ciático, femoral y obturador"],
  ok:1,
  exp:"Preserva-se o torácico longo (serrátil anterior — escápula alada se lesado), toracodorsal (dorsal largo) e intercostobraquial (sensibilidade da face medial do braço)." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuál es la función de los ligamentos de Cooper?",
  ops:["Producir leche en la lactancia",
       "Transportar la linfa al ganglio",
       "Suspender la glándula",
       "Irrigar la mama"],
  ok:2,
  exp:"Fixam a glândula ao tecido subcutâneo e à fáscia peitoral. Sua retração pelo tumor causa retração cutânea ou 'casca de laranja'." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuál es el tipo histológico más común del cáncer de mama?",
  ops:["Lobulillar infiltrante",
       "Ductal invasivo",
       "Medular",
       "Inflamatorio"],
  ok:1,
  exp:"Carcinoma ductal invasivo (CDI) é o mais comum (70-80%). O lobulillar invasivo é o segundo (~10%) e tem maior propensão à multicentricidade e bilateralidade." },

/* NÓDULO Y DIAGNÓSTICO (6-12) */
{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Qué significa la 'triple evaluación' del nódulo mamario?",
  ops:["Solo mamografía y laboratorio",
       "Clínica + imagen + biopsia",
       "Solo biopsia excisional",
       "Solo examen clínico"],
  ok:1,
  exp:"Clínica + imagem + citologia/histologia. A concordância dos três define conduta: benigno, suspeito (biópsia) ou maligno (tratamento)." },

{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Cuál es el examen inicial de elección en mujeres < 35 años?",
  ops:["Mamografía convencional",
       "Ecografía mamaria",
       "Resonancia magnética",
       "Tomografía de tórax"],
  ok:1,
  exp:"Em <35 anos a mama é densa; a ecografia é o exame inicial. Em >40 anos ou mama lipossubstituída, a mamografia é o exame de rastreamento." },

{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Qué significa BI-RADS 5?",
  ops:["Examen normal, sin nada",
       "Achado benigno seguro",
       "Repetir en 6 meses",
       "Alta sospecha (>95%)"],
  ok:3,
  exp:"BI-RADS 5 = altamente sugestivo de malignidade (>95%), com biópsia imediata. BI-RADS 4 é suspeito (4A/4B/4C); BI-RADS 3 é provavelmente benigno." },

{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Cuál es el método de elección para el diagnóstico histológico?",
  ops:["Core biopsy",
       "PAAF",
       "Mamografía con contraste",
       "Exéresis cirúrgica"],
  ok:0,
  exp:"Core biopsy é padrão-ouro: fornece material para histopatologia e imuno-histoquímica. A PAAF não diferencia carcinoma in situ de invasivo." },

{ cat:"Nódulo mamario", tipo:"caso",
  q:"Paciente de 42 años con descarga sanguinolenta unilateral por el pezón, sin nódulo palpable. ¿Diagnóstico más probable y examen de elección?",
  ops:["Cáncer inflamatorio - PET-CT",
       "Mastitis - antibiótico",
       "Papiloma - ductoscopia",
       "Ginecomastia - observación"],
  ok:2,
  exp:"Derrame papilar sanguinolento unilateral é mais comumente causado por papiloma intraductal. Galactografia e ductoscopia localizam a lesão; microdochectomia é diagnóstica e terapêutica." },

{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Cuál es la principal limitación de la mamografía de rastreo?",
  ops:["Mama densa reduce sensibilidad",
       "Costo elevado del examen",
       "Alta exposición a radiación",
       "No detecta microcalcificaciones"],
  ok:0,
  exp:"Em mamas densas, o tecido fibroglandular obscurece o tumor. A ecografia complementa em mamas densas; a RM é considerada em alto risco." },

{ cat:"Nódulo mamario", tipo:"teoria",
  q:"¿Qué significa BI-RADS 0?",
  ops:["Sin ningún hallazgo",
       "Achado benigno seguro",
       "Altamente sospechoso de malignidad",
       "Evaluación incompleta (imagen adicional)"],
  ok:3,
  exp:"BI-RADS 0 = avaliação incompleta, precisando de imagens adicionais (ecografia, ampliação, RM). Usado quando o rastreamento não é conclusivo." },

/* CÁNCER DE MAMA - TEORIA (13-20) */
{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuáles receptores se evalúan por inmunohistoquímica?",
  ops:["Apenas HER2",
       "Apenas RE y RP",
       "RE, RP y HER2",
       "EGFR, KRAS y ALK"],
  ok:2,
  exp:"Perfil molecular = RE, RP e HER2. Orienta terapia endócrina, anti-HER2 (trastuzumabe) e quimioterapia." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuáles son los subtipos moleculares del cáncer de mama?",
  ops:["Solo luminal y basal",
       "Ductal y lobulillar puro",
       "Adenocarcinoma y escamoso",
       "Luminal A, B, HER2+ y TN"],
  ok:3,
  exp:"Luminal A (RE+/RP+, HER2-, Ki67 baixo), Luminal B (Ki67 alto ou HER2+), HER2-enriquecido (RE-/RP-/HER2+) e triple negativo (pior prognóstico, BRCA1)." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuál es el principal factor de riesgo para cáncer de mama?",
  ops:["Uso de desodorante",
       "Idade avançada",
       "Trauma mamario local",
       "Amamentação prolongada"],
  ok:1,
  exp:"Idade avançada é o principal. Outros: história familiar, BRCA1/2, menarca precoce, menopausa tardia, nuliparidade, obesidade, terapia hormonal, álcool." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuál es la principal característica de BRCA1/BRCA2?",
  ops:["Proteção comprovada contra câncer",
       "Risco apenas de câncer de pulmão",
       "Alto risco de mama e ovário",
       "Sem relação com neoplasias"],
  ok:2,
  exp:"Mutações BRCA1/2 conferem alto risco hereditário de mama (60-85%) e ovário (20-40%). Portadores podem optar por vigilância, quimioprevenção ou cirurgia profilática." },

{ cat:"Cáncer de mama", tipo:"caso",
  q:"Paciente de 45 años, CDI de 2,5 cm, axila clinicamente negativa. ¿Conducta quirúrgica inicial?",
  ops:["Mastectomia radical de Halsted",
       "Apenas hormonioterapia",
       "Cirugía conservadora + LNS",
       "Radioterapia exclusiva"],
  ok:2,
  exp:"Câncer inicial com preservação: setorectomia com margens livres + linfonodo sentinela + radioterapia adjuvante. Mastectomia é reservada a tumores grandes, multicêntricos ou escolha da paciente." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuándo se indica la pesquisa del linfonodo sentinela?",
  ops:["Axila negativa",
       "Axila positiva confirmada",
       "Metástasis a distancia",
       "Cáncer inflamatorio"],
  ok:0,
  exp:"LNS é indicado em axila clinicamente negativa. Se positiva, pode indicar esvaziamento axilar ou, em casos selecionados, apenas radioterapia axilar." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Qué es la mastectomia de Patey?",
  ops:["Solo el cuadrante afectado de la mama",
       "Mama, axila, conserva pectoral",
       "Mama, piel y músculos pectorales",
       "Mama y cadena mamaria interna"],
  ok:1,
  exp:"Patey remove a mama e os linfonodos axilares (níveis I e II), preservando o peitoral. Halsted remove também os peitorais (raramente hoje)." },

{ cat:"Cáncer de mama", tipo:"teoria",
  q:"¿Cuándo está indicado el esvaziamento axilar completo?",
  ops:["Axila positiva o LNS+",
       "Siempre que haya cáncer de mama",
       "Apenas en metastático",
       "Nunca es indicado"],
  ok:0,
  exp:"Esvaziamento axilar: axila clinicamente positiva, LNS+ em casos selecionados ou falha da pesquisa. Não é feito profilaticamente em axila negativa." },

/* TRATAMIENTO (21-25) */
{ cat:"Tratamiento", tipo:"teoria",
  q:"¿Cuándo está indicada la neoadyuvancia en cáncer de mama?",
  ops:["Siempre antes de la cirugía",
       "Apenas en metastático",
       "Nunca está indicada",
       "Tumor localmente avanzado"],
  ok:3,
  exp:"Neoadjuvância: tumores localmente avançados (T3-T4 ou N+), HER2+ ou triple negativo (alta resposta patológica), ou para reduzir e permitir cirurgia conservadora." },

{ cat:"Tratamiento", tipo:"teoria",
  q:"¿Cuál es el principal efecto adverso del tamoxifeno?",
  ops:["Ondas de calor solamente",
       "Cáncer endometrial y TEV",
       "Osteoporose grave",
       "Nefrotoxicidad renal"],
  ok:1,
  exp:"Tamoxifeno: aumento do risco de câncer endometrial (~2-4x) e eventos tromboembólicos, além de ondas de calor e secura vaginal. Usado em pré-menopausa RE+." },

{ cat:"Tratamiento", tipo:"teoria",
  q:"¿Cuál es la clase de primera línea para HER2+?",
  ops:["Tamoxifeno oral",
       "Inhibidor de aromatasa",
       "Trastuzumab (anti-HER2)",
       "Cisplatino intravenoso"],
  ok:2,
  exp:"Trastuzumabe é o anticorpo monoclonal anti-HER2 de primeira linha (adjuvante, neoadjuvante e metastático). Outros: pertuzumabe, T-DM1, trastuzumabe deruxtecana." },

{ cat:"Tratamiento", tipo:"caso",
  q:"Paciente de 46 años, mastectomia indicada, desea reconstrucción inmediata. ¿Mejor conducta?",
  ops:["Mastectomia sin reconstrucción posterior",
       "Mastectomia con reconstrucción inmediata",
       "Esperar quimioterapia primero",
       "Reconstrucción después de 5 años"],
  ok:1,
  exp:"Reconstrução imediata (prótese ou retalhos TRAM, DIEP, dorsal largo ou livre) no mesmo tempo cirúrgico melhora autoestima sem alterar prognóstico." },

{ cat:"Tratamiento", tipo:"teoria",
  q:"¿Cuándo se indica hormonioterapia adjuvante?",
  ops:["RE+ y/o RP+",
       "Solo triple negativo",
       "Apenas HER2+",
       "En todos los casos"],
  ok:0,
  exp:"Hormonioterapia adjuvante (tamoxifeno ou inibidor de aromatase) é indicada em tumores RE+ e/ou RP+, reduzindo recidiva e mortalidade. Duração: 5-10 anos." },

/* CASOS CLÍNICOS (26-28) */
{ cat:"Casos clínicos", tipo:"caso",
  q:"Mujer de 58 años, mama eritematosa, casca de laranja, rápido crecimiento. Biopsia: CDI. ¿Diagnóstico y conducta?",
  ops:["Mastitis - antibiótico",
       "Cáncer inicial - cirugía conservadora",
       "Cáncer inflamatorio - neoadyuvancia",
       "Paget - cirugía conservadora"],
  ok:2,
  exp:"Câncer inflamatório: pele eritematosa, casca de laranja, crescimento rápido. Conduta: neoadjuvância + mastectomia + radioterapia." },

{ cat:"Casos clínicos", tipo:"caso",
  q:"Paciente de 55 años con eczema crónico en el pezón. Biopsia: células de Paget. ¿Diagnóstico y conducta?",
  ops:["Dermatitis - corticoide tópico",
       "Mastitis - antibiótico oral",
       "Papiloma - exéresis del ducto",
       "Paget del pezón - investigar"],
  ok:3,
  exp:"Doença de Paget do mamilo é manifestação cutânea de carcinoma ductal subjacente. Conduta: biópsia + investigação + cirurgia (mastectomia ou conservadora)." },

{ cat:"Casos clínicos", tipo:"caso",
  q:"Paciente de 62 años con nódulo retroareolar, ginecomastia unilateral. Biopsia: CDI. ¿Conducta?",
  ops:["Observación clínica cuidadosa",
       "Mastectomia + axila + hormona",
       "Apenas hormonioterapia",
       "Cirugia conservadora"],
  ok:1,
  exp:"Câncer de mama masculino (~1%), geralmente RE+ e ductal. Tratamento: mastectomia + avaliação axilar + tamoxifeno adjuvante." }

];

function diagnosticar(lista) {
  const tamanos = lista.map(p => {
    const lens = p.ops.map(o => o.length);
    const minL = Math.min(...lens);
    const maxL = Math.max(...lens);
    const okL = lens[p.ok];
    const qtdMin = lens.filter(l => l === minL).length;
    const qtdMax = lens.filter(l => l === maxL).length;
    if (okL === minL && qtdMin === 1) return 'corta';
    if (okL === maxL && qtdMax === 1) return 'larga';
    return 'media';
  });
  const dist = tamanos.reduce((a, t) => { a[t] = (a[t] || 0) + 1; return a; }, {});
  console.log('=== Distribución del LARGO de la correcta ===');
  console.log('Corta:', dist.corta || 0, '| Media:', dist.media || 0, '| Larga:', dist.larga || 0, '| Total:', lista.length);
}

const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;
function actualizarMarcador() { marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`; }
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleOptions(p){const idx=p.ops.map((_,i)=>i);shuffle(idx);return {...p,ops:idx.map(i=>p.ops[i]),ok:idx.indexOf(p.ok)};}
function responder(card,caja,exp,p,elegida){
  if(card.dataset.respondida)return;
  card.dataset.respondida="1";
  caja.querySelectorAll('.opcion').forEach((b,j)=>{b.disabled=true;if(j===p.ok)b.classList.add('correcta');if(j===elegida&&elegida!==p.ok)b.classList.add('incorrecta');});
  const acerto=elegida===p.ok;respondidas++;if(acerto)aciertos++;actualizarMarcador();
  exp.innerHTML=`<strong>${acerto?'✅ ¡Correcto!':'❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}
function construir(){
  cont.innerHTML="";respondidas=0;aciertos=0;actualizarMarcador();
  const lote=preguntas.map(shuffleOptions);
  lote.forEach((p,i)=>{
    const card=document.createElement('div');card.className='card '+p.tipo;
    const cab=document.createElement('div');cab.className='cabecera';
    cab.innerHTML=`<div class="numero">${i+1}</div><span class="etiqueta ${p.tipo==='caso'?'c':'t'}">${p.tipo==='caso'?'Caso clínico':'Teoría'}</span><span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);
    const enun=document.createElement('p');enun.className='enunciado';enun.textContent=p.q;card.appendChild(enun);
    const caja=document.createElement('div');caja.className='opciones';
    const exp=document.createElement('div');exp.className='explicacion';
    p.ops.forEach((op,j)=>{const b=document.createElement('button');b.className='opcion';b.innerHTML=`<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;b.addEventListener('click',()=>responder(card,caja,exp,p,j));caja.appendChild(b);});
    card.appendChild(caja);card.appendChild(exp);cont.appendChild(card);
  });
  diagnosticar(lote);
}
construir();
</script>
