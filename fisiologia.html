<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fisiología — Claudir de Jesus Kowal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070d12;
    --surface:#0d151d;
    --line:#1b2833;
    --ink:#e6f1f7;
    --muted:#7b93a5;
    --mint:#38f2c0;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* grade de fundo */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(56,242,192,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,242,192,.07) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
    mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  }
  /* glow */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(700px 420px at 18% -8%, rgba(56,242,192,.20), transparent 65%),
      radial-gradient(650px 450px at 85% 5%, rgba(53,208,255,.16), transparent 65%),
      radial-gradient(600px 400px at 50% 108%, rgba(181,140,255,.14), transparent 65%);
  }
  .wrap{width:min(1040px,92vw);margin-inline:auto;position:relative;z-index:1}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;
    padding:22px 0 0;font-size:.82rem;color:var(--muted);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:600;color:var(--ink);
    letter-spacing:-.01em;font-size:.95rem;white-space:nowrap;
    text-decoration:none;
  }
  .pulse{
    width:9px;height:9px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 0 0 rgba(56,242,192,.7);
    animation:pulse 1.8s infinite;flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(56,242,192,.7)}
    70%{box-shadow:0 0 0 12px rgba(56,242,192,0)}
    100%{box-shadow:0 0 0 0 rgba(56,242,192,0)}
  }
  .flags{display:inline-flex;align-items:center;gap:6px;margin-left:6px;user-select:none}
  .flags svg{width:24px;height:auto;display:block;border-radius:3px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .25s ease}
  .flags svg:hover{transform:scale(1.12)}

  /* ---------- PÁGINA ---------- */
  main{flex:1;padding:44px 0 64px}

  .back{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;
    margin-bottom:36px;transition:color .2s;
  }
  .back:hover{color:var(--mint)}
  .back .arrow{transition:transform .2s}
  .back:hover .arrow{transform:translateX(-4px)}

  .page-title{
    font-size:clamp(1.9rem,4.4vw,2.9rem);
    font-weight:700;letter-spacing:-.04em;
    margin:0;
  }
  .page-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin:10px 0 40px;
  }

  /* ---------- CAPÍTULOS ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

  .chapter{
    --c:var(--mint);
    position:relative;display:flex;flex-direction:column;gap:10px;
    padding:24px 22px 20px;border-radius:16px;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
    border:1px solid var(--line);transition:.3s ease;overflow:hidden;
  }
  .chapter::before{
    content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:radial-gradient(320px 160px at 50% 0%, var(--c), transparent 70%);
    opacity:0;transition:.35s;
  }
  .chapter:hover{
    transform:translateY(-5px);border-color:var(--c);
    box-shadow:0 0 0 1px var(--c),0 26px 54px -28px var(--c);
  }
  .chapter:hover::before{opacity:.10}
  .chapter:focus-visible{outline:2px solid var(--c);outline-offset:3px}

  .chapter-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .chapter-num{font-size:2.1rem;font-weight:700;line-height:1;letter-spacing:-.05em;color:var(--c)}
  .chapter-top svg{width:22px;height:22px;color:var(--c);opacity:.9;flex:0 0 auto;margin-top:4px}
  .chapter-title{margin:0;font-size:.98rem;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
  .chapter-title span{color:var(--muted);font-weight:500}

  .chapter-foot{
    display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:13px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--c);opacity:.75;transition:.25s;
  }
  .chapter:hover .chapter-foot{opacity:1}
  .chapter-foot .arrow{transition:transform .25s}
  .chapter:hover .chapter-foot .arrow{transform:translateX(5px)}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);padding:20px 0}
  .foot-inner{
    display:flex;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);
  }

  @media(max-width:560px){
    main{padding:32px 0 48px}
    .grid{grid-template-columns:1fr}
    .brand{font-size:.86rem}
    .flags svg{width:21px}
  }
</style>
</head>
<body>
