<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claudir de Jesus Kowal — Ejercicios de Medicina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070d12;
    --surface:#0d151d;
    --line:#1b2833;
    --ink:#e6f1f7;
    --muted:#7b93a5;
    --mint:#38f2c0;
    --cyan:#35d0ff;
    --violet:#b58cff;
    --amber:#ffb457;
    --lime:#a3e635;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* grade de fundo */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(56,242,192,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,242,192,.07) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
    mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  }
  /* glow */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(700px 420px at 18% -8%, rgba(56,242,192,.20), transparent 65%),
      radial-gradient(650px 450px at 85% 5%, rgba(53,208,255,.16), transparent 65%),
      radial-gradient(600px 400px at 50% 108%, rgba(181,140,255,.14), transparent 65%);
  }
  .wrap{width:min(1040px,92vw);margin-inline:auto;position:relative;z-index:1}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;
    padding:22px 0 0;font-size:.82rem;color:var(--muted);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:600;color:var(--ink);
    letter-spacing:-.01em;
    font-size:.95rem;
    white-space:nowrap;
  }
  .pulse{
    width:9px;height:9px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 0 0 rgba(56,242,192,.7);
    animation:pulse 1.8s infinite;
    flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(56,242,192,.7)}
    70%{box-shadow:0 0 0 12px rgba(56,242,192,0)}
    100%{box-shadow:0 0 0 0 rgba(56,242,192,0)}
  }
  .flags{
    display:inline-flex;align-items:center;gap:6px;
    margin-left:6px;
    user-select:none;
  }
  .flags svg{
    width:24px;height:auto;display:block;
    border-radius:3px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    transition:transform .25s ease;
  }
  .flags svg:hover{transform:scale(1.12)}

  /* ---------- MÓDULOS ---------- */
  main{flex:1;padding:56px 0 64px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

  .card{
    --c:var(--mint);
    position:relative;display:flex;flex-direction:column;gap:8px;
    padding:24px 22px 20px;border-radius:16px;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
    border:1px solid var(--line);transition:.3s ease;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:radial-gradient(320px 160px at 50% 0%, var(--c), transparent 70%);
    opacity:0;transition:.35s;
  }
  .card:hover{
    transform:translateY(-6px);border-color:var(--c);
    box-shadow:0 0 0 1px var(--c), 0 26px 54px -28px var(--c);
  }
  .card:hover::before{opacity:.10}
  .card:focus-visible{outline:2px solid var(--c);outline-offset:3px}

  .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .num{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.16em;
    color:var(--c);opacity:.85;
  }
  .card-top svg{width:20px;height:20px;color:var(--c);opacity:.9}

  .card h2{
    margin:14px 0 0;font-size:1.22rem;font-weight:600;letter-spacing:-.025em;
  }
  .card-foot{
    display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:13px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--c);opacity:.75;transition:.25s;
  }
  .card:hover .card-foot{opacity:1}
  .card-foot .arrow{transition:transform .25s}
  .card:hover .card-foot .arrow{transform:translateX(5px)}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);padding:20px 0}
  .foot-inner{
    display:flex;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);
  }

  @media(max-width:560px){
    main{padding:36px 0 48px}
    .grid{grid-template-columns:1fr}
    .brand{font-size:.86rem}
    .flags svg{width:21px}
  }
</style>
</head>
<body>

<div class="wrap topbar">
  <span class="brand">
    <span class="pulse"></span>
    Claudir de Jesus Kowal

    <span class="flags" aria-label="Brasil y Bolivia">
      <!-- Brasil -->
      <svg viewBox="0 0 30 21" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brasil">
        <rect width="30" height="21" fill="#009c3b"/>
        <polygon points="15,2.5 27.5,10.5 15,18.5 2.5,10.5" fill="#ffdf00"/>
        <circle cx="15" cy="10.5" r="4.4" fill="#002776"/>
        <path d="M10.9 9.2 Q15 7.6 19.1 9.2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>

      <!-- Bolivia -->
      <svg viewBox="0 0 30 21" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bolivia">
        <rect width="30" height="7" fill="#d52b1e"/>
        <rect y="7" width="30" height="7" fill="#f9e300"/>
        <rect y="14" width="30" height="7" fill="#007934"/>
      </svg>
    </span>
  </span>
</div>

<main class="wrap">
  <nav class="grid" aria-label="Módulos de estudio">

    <a class="card" href="fisiologia.html" style="--c:var(--mint)">
      <div class="card-top">
        <span class="num">01</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 10 2-5h7"/></svg>
      </div>
      <h2>Fisiología</h2>
      <span class="card-foot">Practicar <span class="arrow">→</span></span>
    </a>

    <a class="card" href="cirugia.html" style="--c:var(--cyan)">
      <div class="card-top">
        <span class="num">02</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.8 20 20M8.2 16.2 20 4"/></svg>
      </div>
      <h2>Cirugía</h2>
      <span class="card-foot">Practicar <span class="arrow">→</span></span>
    </a>

    <a class="card" href="microbiologia.html" style="--c:var(--violet)">
      <div class="card-top">
        <span class="num">03</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="3.6" r="1.4"/><circle cx="20.4" cy="12" r="1.4"/><circle cx="12" cy="20.4" r="1.4"/><circle cx="3.6" cy="12" r="1.4"/></svg>
      </div>
      <h2>Microbiología</h2>
      <span class="card-foot">Practicar <span class="arrow">→</span></span>
    </a>

    <a class="card" href="parasitologia.html" style="--c:var(--amber)">
      <div class="card-top">
        <span class="num">04</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="13" rx="5" ry="7"/><path d="M12 6V3M9 8 6.5 5.5M15 8l2.5-2.5M7 13H3M17 13h4M8.5 19 6 22M15.5 19 18 22"/></svg>
      </div>
      <h2>Parasitología</h2>
      <span class="card-foot">Practicar <span class="arrow">→</span></span>
    </a>

    <a class="card" href="farmacologia.html" style="--c:var(--lime)">
      <div class="card-top">
        <span class="num">05</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M8.5 15.5 15.5 8.5"/></svg>
      </div>
      <h2>Farmacología</h2>
      <span class="card-foot">Practicar <span class="arrow">→</span></span>
    </a>

  </nav>
</main>

<footer>
  <div class="wrap foot-inner">
    <span>© 2026 Claudir de Jesus Kowal</span>
  </div>
</footer>

</body>
</html>
