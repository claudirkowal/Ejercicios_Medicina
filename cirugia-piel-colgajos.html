<style>
  :root{--bg:#070d12;--surface:#0d151d;--surface-hi:#151e26;--line:#1b2833;--line-hi:#2c3d49;--ink:#e6f1f7;--muted:#7b93a5;--mint:#38f2c0;--amber:#ffb457;--red:#f87171;}
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;line-height:1.55;min-height:100vh;padding:0 14px 90px;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(56,242,192,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(56,242,192,.055) 1px,transparent 1px);background-size:58px 58px;-webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%)}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(700px 420px at 18% -8%, rgba(56,242,192,.16), transparent 65%),radial-gradient(650px 450px at 85% 5%, rgba(53,208,255,.12), transparent 65%),radial-gradient(600px 400px at 50% 108%, rgba(181,140,255,.10), transparent 65%)}
  .contenedor{max-width:880px;margin:0 auto;position:relative;z-index:1}
  .topbar{display:flex;align-items:center;padding:22px 0 0;font-size:.82rem;color:var(--muted)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);letter-spacing:-.01em;font-size:.95rem;white-space:nowrap;text-decoration:none}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(56,242,192,.7);animation:pulse 1.8s infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,242,192,.7)}70%{box-shadow:0 0 0 12px rgba(56,242,192,0)}100%{box-shadow:0 0 0 0 rgba(56,242,192,0)}}
  .flags{display:inline-flex;align-items:center;gap:6px;margin-left:6px;user-select:none}
  .flags svg{width:22px;height:auto;display:block;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .25s ease}
  .flags svg:hover{transform:scale(1.12)}
  .volver{position:fixed;bottom:20px;left:20px;z-index:100;background:rgba(13,21,29,.92);color:var(--mint);border:1px solid rgba(56,242,192,.45);backdrop-filter:blur(12px);padding:10px 18px;border-radius:30px;text-decoration:none;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(56,242,192,.18),0 4px 14px rgba(0,0,0,.5);transition:background .2s,color .2s,transform .15s;display:inline-flex;align-items:center;gap:8px}
  .volver:hover{background:var(--mint);color:#04222b;border-color:var(--mint);transform:translateY(-2px)}
  .volver .arrow{transition:transform .2s}
  .volver:hover .arrow{transform:translateX(-3px)}
  header.hero{margin-top:40px;padding:28px 26px 26px;border-radius:18px;background:linear-gradient(180deg,rgba(56,242,192,.06),rgba(56,242,192,0));border:1px solid var(--line);position:relative;overflow:hidden}
  header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 200px at 0% 0%, rgba(56,242,192,.15), transparent 70%)}
  .hero-kicker{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mint);border:1px solid rgba(56,242,192,.35);background:rgba(56,242,192,.06);padding:5px 12px;border-radius:999px;display:inline-block;position:relative}
  header.hero h1{margin:14px 0 6px;font-size:1.5rem;letter-spacing:-.03em;font-weight:700;line-height:1.25;color:var(--ink);position:relative}
  header.hero p{margin:0;font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);position:relative}
  .panel{position:sticky;top:12px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(13,21,29,.88);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin:20px 0;font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.04em}
  .panel .marcador{color:var(--mint);font-weight:500}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:14px;transition:border-color .25s,box-shadow .25s;position:relative}
  .card:hover{border-color:var(--line-hi)}
  .card.teoria{border-left:3px solid var(--mint)}
  .card.caso{border-left:3px solid var(--amber)}
  .cabecera{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .numero{background:rgba(56,242,192,.10);color:var(--mint);border:1px solid rgba(56,242,192,.30);font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .etiqueta{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .etiqueta.t{background:rgba(56,242,192,.10);color:var(--mint);border:1px solid rgba(56,242,192,.25)}
  .etiqueta.c{background:rgba(255,180,87,.10);color:var(--amber);border:1px solid rgba(255,180,87,.25)}
  .etiqueta.materia{background:rgba(123,147,165,.08);color:var(--muted);border:1px solid var(--line)}
  .enunciado{margin:0 0 8px;font-weight:600;font-size:1rem;color:var(--ink);line-height:1.5}
  .opciones{margin-top:10px}
  .opcion{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;font-family:'Space Grotesk',inherit;font-size:.92rem;color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,transform .12s}
  .opcion:hover:not(:disabled){background:rgba(56,242,192,.04);border-color:rgba(56,242,192,.35);transform:translateX(2px)}
  .opcion:disabled{cursor:default;opacity:.55}
  .letra{font-weight:700;color:var(--muted);flex:0 0 auto;min-width:16px;font-family:'JetBrains Mono',monospace;font-size:.78rem}
  .opcion.correcta{background:rgba(56,242,192,.10);border-color:var(--mint);opacity:1;font-weight:600}
  .opcion.correcta .letra{color:var(--mint)}
  .opcion.incorrecta{background:rgba(248,113,113,.08);border-color:var(--red);opacity:1}
  .opcion.incorrecta .letra{color:var(--red)}
  .explicacion{display:none;margin-top:14px;padding:14px 16px;border-radius:10px;background:rgba(56,242,192,.05);border-left:3px solid var(--mint);font-size:.88rem;color:var(--ink);line-height:1.65}
  .explicacion strong{color:var(--mint)}
  .explicacion.visible{display:block;animation:aparecer .28s ease}
  @keyframes aparecer{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:34px}
  @media(max-width:560px){header.hero{padding:22px 18px 20px;border-radius:14px}header.hero h1{font-size:1.18rem}.card{padding:18px 16px 14px}.opcion{font-size:.88rem}.panel{font-size:.7rem;padding:10px 14px}.brand{font-size:.86rem}.flags svg{width:20px}.volver{bottom:14px;left:14px;padding:9px 15px;font-size:.82rem}}
</style>
</head>
<body>

<a href="cirugia.html" class="volver"><span class="arrow">←</span> Volver</a>

<div class="contenedor">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="pulse"></span>
      Claudir de Jesus Kowal
      <span class="flags" aria-label="Brasil y Bolivia">
        <svg viewBox="0 0 30 21" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brasil">
          <rect width="30" height="21" fill="#009c3b"/>
          <polygon points="15,2.5 27.5,10.5 15,18.5 2.5,10.5" fill="#ffdf00"/>
          <circle cx="15" cy="10.5" r="4.4" fill="#002776"/>
          <path d="M10.9 9.2 Q15 7.6 19.1 9.2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 30 21" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bolivia">
          <rect width="30" height="7" fill="#d52b1e"/>
          <rect y="7" width="30" height="7" fill="#f9e300"/>
          <rect y="14" width="30" height="7" fill="#007934"/>
        </svg>
      </span>

  </div>

  <header class="hero">
    <span class="hero-kicker">Cirugía · Cap. 01</span>
    <h1>Cirugía de Piel y Colgajos</h1>
    <p>Anatomía cutánea · Injertos y colgajos · Cicatrización · Cáncer de piel</p>
  </header>

  <div class="panel">
    <span class="marcador" id="marcador">Respondidas: 0 / 0 · Aciertos: 0</span>
  </div>

  <div id="quiz"></div>
  <footer>Selecciona una opción para ver la explicación inmediata.</footer>

</div>

<script>
const preguntas = [

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuáles son las tres capas principales de la piel?",
  ops:["Epidermis, dermis y tejido celular subcutáneo",
       "Mucosa, submucosa y muscular",
       "Solo epidermis y dermis",
       "Epidermis, aponeurosis y músculo"],
  ok:0,
  exp:"La piel está formada por epidermis (capa epitelial), dermis (con colágeno y elastina) y tejido celular subcutáneo (grasa). Los anexos cutáneos (folículos pilosos, glándulas sebáceas y sudoríparas) están en la dermis y son clave para la reepitelización." },

{ cat:"Anatomía", tipo:"teoria",
  q:"¿Cuál es la capa de la piel responsable de la mayor resistencia mecánica?",
  ops:["Epidermis",
       "Dermis",
       "Tejido subcutáneo",
       "Estrato córneo"],
  ok:1,
  exp:"La dermis es la capa de mayor resistencia mecánica por su rico contenido en colágeno y elastina. Es la capa que suele suturada en la síntesis quirúrgica y la que sufre en las cicatrices patológicas." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Cuál es la principal diferencia entre un injerto y un colgajo?",
  ops:["El injerto tiene vascularización propia; el colgajo depende del lecho",
       "El injerto depende del lecho para vascularizarse; el colgajo lleva su propia vascularización",
       "El injerto solo se usa en cara; el colgajo en cualquier zona",
       "No hay diferencia, son sinónimos"],
  ok:1,
  exp:"El injerto no tiene vasos propios y depende del lecho receptor para su vascularización (por imbibición y neovascularización). El colgajo lleva su propia vascularización (pedículo) y por eso se puede usar en lechos mal vascularizados." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Cuál es el injerto de espesor total más utilizado en cirugía plástica?",
  ops:["Injerto de piel parcial de muslo",
       "Injerto de piel total de párpado",
       "Injerto de piel total de región retroauricular",
       "Injerto dermoepidérmico de cuero cabelludo"],
  ok:2,
  exp:"El injerto de piel total retroauricular es muy usado en reconstrucción facial (párpados, nariz, oreja) por su color y textura similares, y por su menor retracción que los injertos parciales." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Cuál es la principal desventaja del injerto de piel parcial frente al de espesor total?",
  ops:["Mayor retracción y peor resultado estético",
       "No se puede usar en grandes superficies",
       "Não é viável em leito bem vascularizado",
       "Não permite reepitelização"],
  ok:0,
  exp:"Os enxertos de espessura parcial (ou seja, epiderme + parte da derme) apresentam maior retração cicatricial e pior resultado estético do que os de espessura total. Porém, permitem cobrir grandes áreas e a área doadora reepiteliza." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Qué es un colgajo de rotación?",
  ops:["Colgajo que avança sem girar, em torno de um pedículo central",
       "Colgajo que gira em torno de seu pedículo para cobrir um defeito adjacente",
       "Colgajo livre microvascularizado",
       "Colgajo de tecido muscular exclusivamente"],
  ok:1,
  exp:"O colgajo de rotação é um retalho que gira em torno de seu pedículo para cobrir um defeito adjacente. O defeito da área doadora geralmente é fechado por primeira intenção ou com enxerto." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Qué es un colgajo libre?",
  ops:["Colgajo que permanece na área doadora",
       "Colgajo seccionado e transferido com microanastomose vascular",
       "Colgajo de pele fina sem vasos",
       "Colgajo que não precisa de vasos"],
  ok:1,
  exp:"O colgajo livre é seccionado da área doadora e transferido para a área receptora com reconstrução microcirúrgica dos vasos (artéria e veia). Exemplo: retalho radial do antebraço, retalho anterolateral da coxa (ALT), retalho de grande dorsal." },

{ cat:"Injertos y colgajos", tipo:"teoria",
  q:"¿Cuál es el principal fator determinante da sobrevida de um enxerto de pele?",
  ops:["Vascularização do leito receptor",
       "Cor da pele do doador",
       "Espessura do enxerto exclusivamente",
       "Tamanho da área doadora"],
  ok:0,
  exp:"A vascularização do leito receptor é o principal fator para a sobrevida do enxerto. Leitos com má perfusão (osso exposto, tendão sem paratendão, cartilagem) não são adequados para enxerto e exigem colgajo." },

{ cat:"Cicatrización", tipo:"teoria",
  q:"¿Qué é a cicatrização por primeira intenção?",
  ops:["Fechamento de ferida com bordas aproximadas por sutura",
       "Cicatrização por segunda intenção, sem sutura",
       "Uso de enxerto para cobrir o defeito",
       "Cicatrização apenas em mucosa"],
  ok:0,
  exp:"A cicatrização por primeira intenção ocorre quando as bordas da ferida são aproximadas cirurgicamente, com mínima formação de tecido de granulação e cicatriz fina. Exemplo: ferida cirúrgica suturada." },

{ cat:"Cicatrização", tipo:"teoria",
  q:"¿Cuál é a principal diferença entre cicatriz hipertrófica e queloide?",
  ops:["São sinônimos",
       "A cicatriz hipertrófica respeita os limites da ferida; o queloide ultrapassa os limites",
       "O queloide respeita os limites e a hipertrófica não",
       "O queloide ocorre apenas no tronco"],
  ok:1,
  exp:"A cicatriz hipertrófica fica restrita aos limites da ferida original e tende a regredir com o tempo. O queloide ultrapassa os limites da ferida original, tem crescimento progressivo e alta taxa de recidiva após excisão." },

{ cat:"Cicatrización", tipo:"caso",
  q:"Paciente de 25 anos, negro, apresenta cicatriz elevada e pruriginosa em lóbulo da orelha após piercing, ultrapassando os limites originais. Qual é o diagnóstico e o tratamento inicial?",
  ops:["Cicatriz hipertrófica - corticoide tópico",
       "Queloide - excisão + corticoide intralesional ou compressão",
       "Cicatriz normal - observação",
       "Infecção - antibiótico"],
  ok:1,
  exp:"Cicatriz que ultrapassa os limites originais em paciente predisposto (negro, jovem) é queloide. O tratamento inclui excisão cirúrgica associada a corticoide intralesional, compressão, silicone ou radioterapia para reduzir recidiva." },

{ cat:"Cáncer de piel", tipo:"teoria",
  q:"¿Cuál é o câncer de pele mais comum no mundo?",
  ops:["Melanoma",
       "Carcinoma basocelular",
       "Carcinoma espinocelular",
       "Linfoma cutâneo"],
  ok:1,
  exp:"O carcinoma basocelular é o câncer de pele mais comum no mundo, especialmente em áreas fotoexpostas de adultos e idosos. Tem crescimento lento, raramente metastatiza, mas pode ser localmente invasivo." },

{ cat:"Cáncer de piel", tipo:"teoria",
  q:"¿Cuál é o principal fator prognóstico do melanoma cutâneo?",
  ops:["Cor do paciente",
       "Espessura de Breslow (profundidade de invasão em mm)",
       "Tamanho da lesão visível",
       "Localização no corpo"],
  ok:1,
  exp:"A espessura de Breslow (medida da camada granulosa até o ponto mais profundo de invasão, em mm) é o principal fator prognóstico do melanoma cutâneo. Complementa-se com níveis de Clark, ulceração e índice mitótico." },

{ cat:"Cáncer de piel", tipo:"caso",
  q:"Paciente de 62 anos, agricultor, apresenta lesão ulcerada em dorso nasal de 1,5 cm, bordas elevadas peroladas, telangiectasias, crescimento lento há 2 anos. Qual é o diagnóstico e o tratamento?",
  ops:["Melanoma - ampliação de margem",
       "Carcinoma basocelular - excisão com margem de 4-5 mm",
       "Carcinoma espinocelular - radioterapia",
       "Ceratose actínica - crioterapia"],
  ok:1,
  exp:"Lesão perolada, ulcerada, com telangiectasias em área fotoexposta é típica de carcinoma basocelular. O tratamento padrão é excisão cirúrgica com margem de 4-5 mm e confirmação histológica. Em locais delicados (pálpebra, nariz), a cirurgia de Mohs é uma opção." }

];

const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;
function actualizarMarcador() { marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`; }
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleOptions(p){const idx=p.ops.map((_,i)=>i);shuffle(idx);return {...p,ops:idx.map(i=>p.ops[i]),ok:idx.indexOf(p.ok)};}
function responder(card,caja,exp,p,elegida){
  if(card.dataset.respondida)return;
  card.dataset.respondida="1";
  caja.querySelectorAll('.opcion').forEach((b,j)=>{b.disabled=true;if(j===p.ok)b.classList.add('correcta');if(j===elegida&&elegida!==p.ok)b.classList.add('incorrecta');});
  const acerto=elegida===p.ok;respondidas++;if(acerto)aciertos++;actualizarMarcador();
  exp.innerHTML=`<strong>${acerto?'✅ ¡Correcto!':'❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}
function construir(){
  cont.innerHTML="";respondidas=0;aciertos=0;actualizarMarcador();
  const lote=preguntas.map(shuffleOptions);
  lote.forEach((p,i)=>{
    const card=document.createElement('div');card.className='card '+p.tipo;
    const cab=document.createElement('div');cab.className='cabecera';
    cab.innerHTML=`<div class="numero">${i+1}</div><span class="etiqueta ${p.tipo==='caso'?'c':'t'}">${p.tipo==='caso'?'Caso clínico':'Teoría'}</span><span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);
    const enun=document.createElement('p');enun.className='enunciado';enun.textContent=p.q;card.appendChild(enun);
    const caja=document.createElement('div');caja.className='opciones';
    const exp=document.createElement('div');exp.className='explicacion';
    p.ops.forEach((op,j)=>{const b=document.createElement('button');b.className='opcion';b.innerHTML=`<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;b.addEventListener('click',()=>responder(card,caja,exp,p,j));caja.appendChild(b);});
    card.appendChild(caja);card.appendChild(exp);cont.appendChild(card);
  });
}
construir();
</script>
