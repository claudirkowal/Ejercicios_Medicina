<style>
  :root{
    --bg:#070d12;--surface:#0d151d;--surface-hi:#151e26;
    --line:#1b2833;--line-hi:#2c3d49;
    --ink:#e6f1f7;--muted:#7b93a5;
    --mint:#38f2c0;--cyan:#35d0ff;--violet:#b58cff;--amber:#ffb457;--red:#f87171;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    line-height:1.55;min-height:100vh;padding:0 14px 90px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(56,242,192,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,242,192,.055) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
    mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(700px 420px at 18% -8%, rgba(56,242,192,.16), transparent 65%),
      radial-gradient(650px 450px at 85% 5%, rgba(53,208,255,.12), transparent 65%),
      radial-gradient(600px 400px at 50% 108%, rgba(181,140,255,.10), transparent 65%);
  }
  .contenedor{max-width:880px;margin:0 auto;position:relative;z-index:1}

  .topbar{display:flex;align-items:center;padding:22px 0 0;font-size:.82rem;color:var(--muted)}
  .brand{
    display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);
    letter-spacing:-.01em;font-size:.95rem;white-space:nowrap;text-decoration:none;
  }
  .pulse{
    width:9px;height:9px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 0 0 rgba(56,242,192,.7);animation:pulse 1.8s infinite;flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(56,242,192,.7)}
    70%{box-shadow:0 0 0 12px rgba(56,242,192,0)}
    100%{box-shadow:0 0 0 0 rgba(56,242,192,0)}
  }
  .flags{display:inline-flex;align-items:center;gap:6px;margin-left:6px;user-select:none}
  .flags svg{width:22px;height:auto;display:block;border-radius:3px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .25s ease}
  .flags svg:hover{transform:scale(1.12)}

  .volver{
    position:fixed;bottom:20px;left:20px;z-index:100;
    background:rgba(13,21,29,.92);color:var(--mint);
    border:1px solid rgba(56,242,192,.45);backdrop-filter:blur(12px);
    padding:10px 18px;border-radius:30px;text-decoration:none;
    font-weight:600;font-size:.88rem;
    box-shadow:0 8px 24px rgba(56,242,192,.18),0 4px 14px rgba(0,0,0,.5);
    transition:background .2s,color .2s,transform .15s,box-shadow .2s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .volver:hover{
    background:var(--mint);color:#04222b;border-color:var(--mint);
    transform:translateY(-2px);box-shadow:0 12px 28px rgba(56,242,192,.35);
  }
  .volver .arrow{transition:transform .2s}
  .volver:hover .arrow{transform:translateX(-3px)}

  header.hero{
    margin-top:40px;padding:28px 26px 26px;border-radius:18px;
    background:linear-gradient(180deg,rgba(56,242,192,.06),rgba(56,242,192,0));
    border:1px solid var(--line);position:relative;overflow:hidden;
  }
  header.hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(400px 200px at 0% 0%, rgba(56,242,192,.15), transparent 70%);
  }
  .hero-kicker{
    font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--mint);
    border:1px solid rgba(56,242,192,.35);background:rgba(56,242,192,.06);
    padding:5px 12px;border-radius:999px;display:inline-block;position:relative;
  }
  header.hero h1{
    margin:14px 0 6px;font-size:1.5rem;letter-spacing:-.03em;
    font-weight:700;line-height:1.25;color:var(--ink);position:relative;
  }
  header.hero p{
    margin:0;font-family:'JetBrains Mono',monospace;
    font-size:.76rem;color:var(--muted);position:relative;
  }

  .panel{
    position:sticky;top:12px;z-index:20;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:rgba(13,21,29,.88);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:12px;
    padding:12px 18px;margin:20px 0;
    font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.04em;
  }
  .panel .marcador{color:var(--mint);font-weight:500}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 18px;margin-bottom:14px;
    transition:border-color .25s,box-shadow .25s;position:relative;
  }
  .card:hover{border-color:var(--line-hi)}
  .card.teoria{border-left:3px solid var(--mint)}
  .card.caso{border-left:3px solid var(--amber)}

  .cabecera{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .numero{
    background:rgba(56,242,192,.10);color:var(--mint);
    border:1px solid rgba(56,242,192,.30);
    font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .etiqueta{
    font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;
  }
  .etiqueta.t{background:rgba(56,242,192,.10);color:var(--mint);border:1px solid rgba(56,242,192,.25)}
  .etiqueta.c{background:rgba(255,180,87,.10);color:var(--amber);border:1px solid rgba(255,180,87,.25)}
  .etiqueta.materia{background:rgba(123,147,165,.08);color:var(--muted);border:1px solid var(--line)}

  .enunciado{margin:0 0 8px;font-weight:600;font-size:1rem;color:var(--ink);line-height:1.5}
  .opciones{margin-top:10px}
  .opcion{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-top:8px;
    font-family:'Space Grotesk',inherit;font-size:.92rem;color:var(--ink);
    cursor:pointer;transition:background .18s,border-color .18s,transform .12s;
  }
  .opcion:hover:not(:disabled){
    background:rgba(56,242,192,.04);border-color:rgba(56,242,192,.35);transform:translateX(2px);
  }
  .opcion:disabled{cursor:default;opacity:.55}
  .letra{
    font-weight:700;color:var(--muted);flex:0 0 auto;min-width:16px;
    font-family:'JetBrains Mono',monospace;font-size:.78rem;
  }
  .opcion.correcta{background:rgba(56,242,192,.10);border-color:var(--mint);opacity:1;font-weight:600}
  .opcion.correcta .letra{color:var(--mint)}
  .opcion.incorrecta{background:rgba(248,113,113,.08);border-color:var(--red);opacity:1}
  .opcion.incorrecta .letra{color:var(--red)}

  .explicacion{
    display:none;margin-top:14px;padding:14px 16px;border-radius:10px;
    background:rgba(56,242,192,.05);border-left:3px solid var(--mint);
    font-size:.88rem;color:var(--ink);line-height:1.65;
  }
  .explicacion strong{color:var(--mint)}
  .explicacion.visible{display:block;animation:aparecer .28s ease}
  @keyframes aparecer{
    from{opacity:0;transform:translateY(-6px)}
    to{opacity:1;transform:translateY(0)}
  }

  footer{text-align:center;font-family:'JetBrains Mono',monospace;
    font-size:.72rem;color:var(--muted);margin-top:34px}

  @media(max-width:560px){
    header.hero{padding:22px 18px 20px;border-radius:14px}
    header.hero h1{font-size:1.18rem}
    .card{padding:18px 16px 14px}
    .opcion{font-size:.88rem}
    .panel{font-size:.7rem;padding:10px 14px}
    .brand{font-size:.86rem}
    .flags svg{width:20px}
    .volver{bottom:14px;left:14px;padding:9px 15px;font-size:.82rem}
  }
</style>
</head>

  <div class="panel">

<script>
const preguntas = [

/* ========= PRINCIPIOS GENERALES (1-15) ========= */
{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuáles son las dos misiones fundamentales de las glándulas secretoras digestivas?",
  ops:["Secretar enzimas digestivas y moco",
       "Producir hormonas y sales biliares para emulsionar grasas en el duodeno",
       "Solo absorber agua",
       "Regular el pH y la motilidad"],
  ok:0,
  exp:"Las glándulas digestivas secretan enzimas digestivas (desde la boca al íleon distal) y moco (desde la boca al ano) para digestión y protección." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las células caliciformes responden principalmente a:",
  ops:["Estimulación hormonal por gastrina y secretina duodenales",
       "Irritación local",
       "Estimulación parasimpática vagal directa",
       "Distensión de la pared gástrica por el bolo alimenticio"],
  ok:1,
  exp:"Las células caliciformes expulsan moco en respuesta a la irritación local del epitelio, actuando como lubricante protector." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las criptas de Lieberkühn son:",
  ops:["Vellosidades del intestino",
       "Conductos de glándulas salivales",
       "Invaginaciones del epitelio intestinal hacia la submucosa",
       "Glándulas tubulares del estómago"],
  ok:2,
  exp:"Las criptas de Lieberkühn son invaginaciones del epitelio hacia la submucosa en el intestino delgado, con células secretoras especializadas." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las glándulas oxínticas se localizan en:",
  ops:["El intestino delgado entero",
       "Las glándulas salivales mayores",
       "El colon ascendente y transverso",
       "El estómago y duodeno proximal"],
  ok:3,
  exp:"Las glándulas oxínticas (tubulares profundas) se encuentran en el estómago y porción proximal del duodeno, secretando HCl y pepsinógeno." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuáles son glándulas complejas asociadas al tubo digestivo?",
  ops:["Salivales, páncreas e hígado",
       "Solo células caliciformes",
       "Criptas de Lieberkühn y glándulas de Brunner duodenales",
       "Glándulas mucosas simples"],
  ok:0,
  exp:"Las glándulas salivales, el páncreas y el hígado son glándulas complejas que proporcionan secreciones para digestión o emulsión de los alimentos." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las glándulas salivales y el páncreas son glándulas:",
  ops:["Tubulares simples",
       "Mucosas unicelulares",
       "Acinosas, formadas por acinos que secretan el componente primario",
       "Endocrinas de secreción sistémica"],
  ok:2,
  exp:"Las glándulas salivales y el páncreas son glándulas acinosas (acinares), formadas por acinos que secretan el componente primario de la secreción." },

{ cat:"Principios generales", tipo:"teoria",
  q:"El contacto del alimento con el epitelio estimula la secreción mediante:",
  ops:["Solo hormonas gastrointestinales",
       "Sistema nervioso central",
       "Sistema simpático toracolumbar",
       "Estímulos nerviosos entéricos"],
  ok:3,
  exp:"El contacto del alimento con el epitelio activa el sistema nervioso entérico mediante estímulos táctiles, irritación química y distensión de la pared." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La estimulación parasimpática del tubo digestivo produce:",
  ops:["Aumento de la secreción glandular",
       "Disminución de la secreción",
       "Inhibición de la motilidad",
       "Vasoconstricción de la mucosa"],
  ok:0,
  exp:"La estimulación parasimpática (vago y glosofaríngeo) aumenta la velocidad de secreción glandular del tubo digestivo." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La estimulación simpática aislada sobre las glándulas digestivas produce:",
  ops:["Aumento copioso de la secreción",
       "Inhibición total inmediata",
       "Ningún efecto",
       "Ligero aumento de la secreción"],
  ok:3,
  exp:"La estimulación simpática aislada produce un ligero aumento de la secreción; si hay secreción copiosa por parasimpático u hormonal, la reduce por vasoconstricción." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Cuando la estimulación simpática se superpone a la parasimpática, la secreción:",
  ops:["Aumenta por sinergia",
       "Disminuye por vasoconstricción",
       "No cambia significativamente",
       "Se vuelve más ácida y abundante en enzimas digestivas"],
  ok:1,
  exp:"La estimulación simpática sobreañadida a la parasimpática reduce la secreción, sobre todo por disminución del flujo sanguíneo glandular." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las hormonas gastrointestinales regulan la secreción al ser liberadas hacia:",
  ops:["La luz intestinal, actuando directamente sobre las glándulas secretoras",
       "El sistema linfático mesentérico",
       "La sangre",
       "El sistema nervioso entérico por sinapsis directas"],
  ok:2,
  exp:"Las hormonas gastrointestinales se liberan de la mucosa intestinal hacia la sangre, que las transporta hasta las glándulas para estimular la secreción." },

{ cat:"Principios generales", tipo:"teoria",
  q:"En el mecanismo básico de secreción, las vesículas se liberan por:",
  ops:["Difusión simple apical",
       "Pinocitosis inversa",
       "Transporte activo primario",
       "Exocitosis mediada por calcio"],
  ok:3,
  exp:"Las vesículas secretoras se almacenan hasta que un influjo de calcio desencadena su exocitosis, liberando el contenido al exterior celular." },

{ cat:"Principios generales", tipo:"teoria",
  q:"El moco es resistente a la digestión porque:",
  ops:["Es una glucoproteína anfótera",
       "Contiene enzimas proteolíticas",
       "Es un lípido insoluble",
       "Es una proteína simple de alto peso molecular"],
  ok:0,
  exp:"El moco está formado por glucoproteínas anfóteras capaces de tamponar ácidos y álcalis. Es adherente, lubrica y resiste la digestión." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La secreción de las glándulas digestivas requiere:",
  ops:["Solo agua del plasma",
       "Solo iones sodio y potasio",
       "ATP y mitocondrias",
       "Solo hormonas gastrointestinales"],
  ok:2,
  exp:"La secreción glandular requiere energía (ATP) producida por las mitocondrias para la síntesis de sustancias orgánicas y el transporte activo de iones." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La modificación de la secreción primaria ocurre en:",
  ops:["Los acinos secretores",
       "El tejido conectivo periductal",
       "La sangre que perfunde la glándula",
       "Los conductos excretores"],
  ok:3,
  exp:"La secreción primaria de los acinos se modifica en los conductos mediante transporte activo (reabsorción de sodio, secreción de potasio y bicarbonato)." },

/* ========= SECRECIÓN SALIVAL (16-30) ========= */
{ cat:"Secreción salival", tipo:"teoria",
  q:"Las glándulas salivales principales son:",
  ops:["Parótida, submandibular y sublingual",
       "Solo la parótida bilateral",
       "Solo las sublinguales anteriores",
       "Células caliciformes y glándulas oxínticas gástricas"],
  ok:0,
  exp:"Las glándulas salivales principales son la parótida, la submandibular y la sublingual, además de numerosas glándulas bucales pequeñas." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La glándula parótida secreta principalmente:",
  ops:["Secreción mucosa espesa",
       "Secreción serosa",
       "Secreción mixta seromucosa",
       "Solo agua con electrolitos sin enzimas"],
  ok:1,
  exp:"La glándula parótida secreta casi exclusivamente saliva serosa, rica en ptialina (α-amilasa)." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"Las glándulas submandibulares y sublinguales secretan:",
  ops:["Solo seroso",
       "Solo mucoso",
       "Seroso y mucoso",
       "Solo enzimas digestivas sin agua"],
  ok:2,
  exp:"Las glándulas submandibulares y sublinguales secretan una mezcla de seroso y mucoso. Las glándulas bucales secretan solo moco." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"El pH de la saliva es aproximadamente:",
  ops:["2-3 por la ptialina",
       "8-9 por el bicarbonato",
       "4-5 por el jugo gástrico",
       "6-7"],
  ok:3,
  exp:"El pH de la saliva es de 6-7, favorable para la acción de la ptialina (α-amilasa salival)." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La ptialina salival es una enzima que:",
  ops:["Inicia la digestión del almidón",
       "Digiere proteínas",
       "Digiere grasas",
       "Neutraliza el ácido gástrico"],
  ok:0,
  exp:"La ptialina (α-amilasa salival) inicia la hidrólisis del almidón y del glucógeno en maltosa y polímeros pequeños de glucosa." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La secreción salival es un proceso de:",
  ops:["Una sola etapa simple",
       "Dos etapas, acinar y ductal",
       "Tres etapas con modificación gástrica",
       "Cuatro etapas complejas"],
  ok:1,
  exp:"La secreción salival tiene dos etapas: los acinos secretan la secreción primaria y los conductos la modifican mediante transporte activo." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"En los conductos salivales, el sodio se:",
  ops:["Secreta activamente",
       "No se modifica",
       "Reabsorbe activamente",
       "Se filtra pasivamente"],
  ok:2,
  exp:"En los conductos salivales, el sodio se reabsorbe activamente y el potasio se secreta en intercambio, lo que hace la saliva hipotónica." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La saliva contiene grandes cantidades de:",
  ops:["Sodio y cloro",
       "Calcio y fosfato",
       "Hierro y cobre",
       "Potasio y bicarbonato"],
  ok:3,
  exp:"La saliva contiene grandes cantidades de potasio y bicarbonato, y es hipotónica respecto al plasma." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La saliva ayuda a la higiene oral porque contiene:",
  ops:["Lisozima e inmunoglobulinas",
       "Solo agua con pH neutro",
       "Ácido clorhídrico bactericida",
       "Pepsina proteolítica"],
  ok:0,
  exp:"La saliva contiene lisozima, tiocianato, enzimas proteolíticas e inmunoglobulinas que destruyen bacterias orales y ayudan a la higiene bucal." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La secreción salival está controlada por:",
  ops:["Solo hormonas como la aldosterona",
       "Vías parasimpáticas",
       "Solo el sistema simpático toracolumbar",
       "La médula suprarrenal por catecolaminas"],
  ok:1,
  exp:"La secreción salival está controlada por vías nerviosas parasimpáticas desde los núcleos salivales superior e inferior del tronco encefálico." },

{ cat:"Secreción salival", tipo:"caso",
  q:"Paciente de 65 años con radioterapia cervical por carcinoma laríngeo presenta sequedad bucal, disfagia y caries de rápida progresión. ¿Qué mecanismo explica estos síntomas?",
  ops:["Aumento compensador de la digestión del almidón",
       "Aumento de la secreción gástrica refleja",
       "Disminución de la secreción salival",
       "Mejora compensadora de la deglución"],
  ok:2,
  exp:"La radioterapia cervical lesiona las glándulas salivales. La xerostomía resultante aumenta el riesgo de caries, infecciones orales y dificultad para deglutir." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La lipasa lingual es una enzima salival que:",
  ops:["Digiere proteínas",
       "Digiere almidón",
       "Neutraliza el ácido gástrico",
       "Inicia la digestión de grasas"],
  ok:3,
  exp:"La lipasa lingual inicia la digestión de los triglicéridos en la boca y el estómago, aunque su acción es limitada." },

{ cat:"Secreción salival", tipo:"teoria",
  q:"La saliva favorece la deglución porque:",
  ops:["Humedecer y lubrica el bolo",

/* ========= LÓGICA CON EMBARALHAMIENTO ========= */
const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleOptions(p) {
  const idx = p.ops.map((_, i) => i);
  shuffle(idx);
  return { ...p, ops: idx.map(i => p.ops[i]), ok: idx.indexOf(p.ok) };
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  const lote = preguntas.map(shuffleOptions);

  lote.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });

  /* Diagnóstico de patrones en consola */
  const letras = {A:0, B:0, C:0, D:0};
  let correctaLarga = 0, correctaCorta = 0, correctaMedia = 0;
  lote.forEach(p => {
    letras['ABCD'[p.ok]]++;
    const largos = p.ops.map(o => o.length);
    const max = Math.max(...largos);
    const min = Math.min(...largos);
    const lc = largos[p.ok];
    if (lc === max) correctaLarga++;
    else if (lc === min) correctaCorta++;
    else correctaMedia++;
  });
  console.log('=== Distribución de ESTA sesión ===');
  console.log('Correctas por letra:', letras);
  console.log('Correcta más larga:', correctaLarga, '| más corta:', correctaCorta, '| intermedia:', correctaMedia);
}

construir();
</script>
